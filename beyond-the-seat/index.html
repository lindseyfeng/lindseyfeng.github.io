<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beyond the Seat · Study space finder</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#122e32;font:16px/1.5 "Inter","Segoe UI",Arial,sans-serif}header,footer,main{max-width:1080px;margin:auto;padding:22px 28px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:20px}header{border-bottom:1px solid #b8c7c2}.word{font-weight:750;font-size:20px;letter-spacing:-.04em}.mark{display:inline-block;width:22px;height:17px;border:4px solid #16776d;border-top:0;margin-right:10px;vertical-align:middle}small,footer{font-size:14px;color:#466360}main{min-height:70vh;padding-top:44px}h1,h2,h3,p{margin:0 0 12px}h1{font:normal clamp(38px,6vw,70px)/1.04 Georgia,serif;letter-spacing:-.055em}h2{font:normal 32px/1.14 Georgia,serif}h3{font-size:19px}main>p{margin:16px 0 30px}button,a{font:inherit}button{border:1px solid #aebfba;border-radius:8px;padding:10px 16px;background:#fff;color:inherit;cursor:pointer;font-weight:600}button:hover{background:#e4eeeb}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #edb12b;outline-offset:3px}.primary{background:#095c54;color:white;border-color:#095c54}.primary:hover{background:#074a44}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card,fieldset{background:white;border:1px solid #c7d2cb;border-radius:16px;padding:24px;min-width:0}.card.feature{background:#e1efea}.card>button{margin-top:10px}.plan{position:relative;overflow:hidden;height:120px;margin:-24px -24px 24px;border-radius:15px 15px 0 0;background:repeating-linear-gradient(0deg,transparent 0 15px,#c9ded5 16px),repeating-linear-gradient(90deg,#dcebe5 0 15px,#c9ded5 16px);display:flex;align-items:center;justify-content:center;gap:26px}.desk{position:relative;background:#f7fcf7;border:2px solid #668e82;width:55px;height:29px;border-radius:5px;box-shadow:0 -6px 0 -2px #7ca899,0 6px 0 -2px #7ca899}.lab{background:repeating-linear-gradient(0deg,transparent 0 15px,#d4d9e2 16px),repeating-linear-gradient(90deg,#e5e9ee 0 15px,#d4d9e2 16px)}.lab .desk:after{content:"";position:absolute;left:12px;width:24px;top:6px;border:3px solid #445773}.ey{font-size:13px;text-transform:uppercase;font-weight:750;letter-spacing:.09em;color:#40635a}.status{display:inline-block;padding:4px 9px;background:#e2eee8;border-radius:5px;font-weight:600;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.notice{border-left:4px solid #b48422;background:#fff4d7;padding:12px 16px;margin:16px 0}.card p{max-width:60ch}label{display:block;padding:9px 0;cursor:pointer}input{accent-color:#095c54;width:17px;height:17px}legend{font-weight:700}a{color:#095c54}footer{border-top:1px solid #c7d2cb;flex-wrap:wrap}details{margin:24px 0}summary{cursor:pointer} @media(max-width:650px){.grid{grid-template-columns:1fr}header,main,footer{padding:18px}main{padding-top:30px}header small{max-width:120px;text-align:right}}@media print{header,footer,.actions,button{display:none}main{padding:0}.card{break-inside:avoid}}
</style><header><div class="word"><span class="mark"></span>Beyond the Seat</div><small>Study space finder · Georgia Tech</small></header><main id="app" tabindex="-1"></main><footer><span>Course prototype · Simulated conditions at 10:06 a.m.</span><a download="Beyond-the-Seat.html" href="./index.html">Download HTML demo</a></footer><script>
const places=[
{name:'Grove reading area',zone:'Reading and collaboration',desc:'Shared tables for reading or working together. Conversation is welcome.',quiet:false,monitor:false,time:'10:02',busy:'Moderately busy'},
{name:'Quiet reading room',zone:'Quiet individual study',desc:'Individual desks for silent reading. Take calls outside the zone.',quiet:true,monitor:false,time:'10:05',busy:'Lightly used'},
{name:'Quiet workstation area',zone:'Quiet individual study',desc:'Monitor desks for focused work. Take calls outside the zone.',quiet:true,monitor:true,time:'10:03',busy:'Lightly used'},
{name:'Project workstation area',zone:'Collaborative work',desc:'Monitor desks suited to debugging with a partner. Expect nearby conversation.',quiet:false,monitor:true,time:'10:04',busy:'Moderately busy'}];
const travel=[[2,5,6,2],[0,3,5,3],[3,0,2,4],[5,2,0,4],[3,4,4,0]];
let from=-1,priority='walk',monitor=false,task='read',omitted=new Set(),picked=-1,note='';
const app=document.querySelector('main'),btn=(label,fn,primary=false)=>'<button class="'+(primary?'primary':'')+'" onclick="'+fn+'">'+label+'</button>';
function view(title,sub,body){app.innerHTML='<h1>'+title+'</h1><p>'+sub+'</p>'+body;app.focus();window.scrollTo(0,0)}
function art(lab){return '<div aria-hidden="true" class="plan '+(lab?'lab':'')+'"><i class="desk"></i><i class="desk"></i><i class="desk"></i></div>'}
function home(){from=-1;priority='walk';monitor=false;task='read';omitted.clear();picked=-1;note='';view('Find a study space.','What brings you to the library today?', '<div class="grid"><section class="card feature">'+art(false)+'<h2>Read between classes</h2><p>Find a nearby reading spot in one tap.</p>'+btn('Find a reading spot','results()',true)+'</section><section class="card">'+art(true)+'<h2>Set my priorities</h2><p>Compare equipment, quiet and walking time.</p>'+btn('Choose preferences','custom()')+'</section></div>')}
function custom(){task='custom';monitor=true;priority='quiet';prefs()}
function prefs(){view('Your priorities','Choose what you need for this session. Your ranking preference can change at any time.','<div class="grid"><fieldset><legend>Required equipment</legend><label><input id="mon" type="checkbox" '+(monitor?'checked':'')+'> External monitor</label><small>Includes areas with installed monitors. Free units are unconfirmed.</small></fieldset><fieldset><legend>Rank spaces by</legend>'+['quiet','walk'].map((v,i)=>'<label><input type="radio" name="rank" value="'+v+'" '+(priority===v?'checked':'')+'> '+['Quiet first','Shortest walk first'][i]+'</label>').join('')+'</fieldset></div><div class="actions">'+btn('Show matching spaces','applyPrefs()',true)+btn('Start over','home()')+'</div>')}
function applyPrefs(){task='custom';monitor=document.querySelector('#mon').checked;priority=document.querySelector('input[name=rank]:checked').value;results()}
function dist(i){return travel[from+1][i]}
function rank(){return places.map((p,i)=>i).filter(i=>!omitted.has(i)&&(!monitor||places[i].monitor)&&(task!=='read'||i<2)).sort((a,b)=>(priority==='quiet'?Number(places[b].quiet)-Number(places[a].quiet):0)||dist(a)-dist(b))}
function evidence(p){return '<p><span class="status">'+p.busy+'</span> <small>Area estimate · '+p.time+' a.m.</small></p><p>'+ (p.monitor?'Monitor desks installed · <b>Free monitors unknown</b>':'Individual seat availability unknown')+'</p>'}
function results(){const ids=rank();view(task==='read'?'Nearby reading spots':'Your matches',(monitor?'Monitor required · ':'')+(priority==='quiet'?'Quiet first':'Shortest walk first')+' · From '+(from<0?'the entrance':places[from].name), (note?'<div class="notice" role="status">'+note+'</div>':'')+'<div class="grid">'+ids.map((i,j)=>{let p=places[i];return '<section class="card '+(!j?'feature':'')+'"><p class="ey">'+(j?'Alternative':'First suggestion')+'</p><h2>'+p.name+'</h2><p><b>'+dist(i)+' min walk</b> · '+p.zone+'</p><p>'+p.desc+'</p>'+evidence(p)+(!j?'<p><b>Why this space?</b> '+(priority==='quiet'&&p.quiet?'Quiet use matches your first priority.':'It has the shortest walk among the eligible options.')+'</p>':'')+btn('Choose this space','choose('+i+')',!j)+'</section>'}).join('')+'</div>'+(!ids.length?'<p>No other areas match. Adjust your requirements or start a new search.</p>':'')+'<div class="actions">'+btn('Adjust preferences','prefs()')+btn('Start over','home()')+'</div>')}
function choose(i){picked=i;let p=places[i];view(p.name,'Selected destination · Walk-in seating','<section class="card">'+art(p.monitor)+'<p class="ey">'+p.zone+'</p><h2>'+dist(i)+' min from '+(from<0?'the entrance':places[from].name)+'</h2><p>'+p.desc+'</p>'+evidence(p)+'<h3>When you arrive</h3><p>If the space is full, get another suggestion from here. This removes the area for your current search.</p><div class="actions">'+btn('Full here · find another','full()',true)+btn('Report a mismatch','report()')+'</div></section><div class="actions">'+btn('Back to matches','results()')+'</div>')}
function full(){from=picked;omitted.add(picked);note=places[picked].name+' excluded. Walking times now start here. Your preferences are saved.';results()}
function report(){view('What differs?',places[picked].name,'<fieldset><legend>Report for this demo session</legend>'+['Missing or broken equipment','Unexpected conversation','Crowding estimate looks wrong'].map((v,i)=>'<label><input type="radio" name="issue" '+(!i?'checked':'')+' value="'+v+'"> '+v+'</label>').join('')+'</fieldset><div class="actions">'+btn('Save report and find another','saveReport()',true)+btn('Cancel','choose(picked)')+'</div>')}
function saveReport(){let reason=document.querySelector('input[name=issue]:checked').value;from=picked;omitted.add(picked);note='Saved for this demo: '+reason+'. This area is hidden for your session.';results()}
home()
</script></html>
